format = """
╭[](COLOR_PRIMARY)\
[ \uf313  ](fg:COLOR_PRIMARY)\
$directory\
$git_branch\
$git_status\
$nodejs\
$rust\
$golang\
$php\
$time\
\n╰$character"""

[directory]
style = "fg:COLOR_SECONDARY"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "fg:COLOR_SECONDARY"
format = '[│ $symbol $branch ]($style)'

[git_status]
style = "fg:COLOR_SECONDARY"
format = '[($all_status$ahead_behind)]($style)'

[nodejs]
symbol = ""
style = "fg:COLOR_SECONDARY"
format = '[│ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "fg:COLOR_SECONDARY"
format = '[│ $symbol ($version) ]($style)'

[golang]
symbol = ""
style = "fg:COLOR_SECONDARY"
format = '[│ $symbol ($version) ]($style)'

[php]
symbol = ""
style = "fg:COLOR_SECONDARY"
format = '[│ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:COLOR_TEXT"
format = '[│ 󰥔 $time ]($style)'
