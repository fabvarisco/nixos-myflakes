################
### MONITORS ###
################

# Laptop display (Full HD)
monitor=eDP-1,1920x1080@60,0x0,1.0

# External 4K monitor at 150% scale
monitor=,preferred,auto,1.5

# nwg-displays configuration (auto-generated)
source = ~/.config/hypr/monitors.conf

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun

#################
### AUTOSTART ###
#################

exec-once = waybar &
exec-once = swaync &

# exec-once = nm-applet --indicator &  # Removed - using iwd instead of NetworkManager
exec-once = swww-daemon
exec-once = sleep 1 && swww img "~/.config/walls/lock.jpg" --transition-type fade --transition-duration 1
exec-once = sleep 3 && ~/.config/hypr/wallpaper-slideshow.sh
exec-once = avizo-service &

# Clipboard manager
exec-once = clipse -listen

# GNOME apps com tema claro (Calendar, etc)
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-light'

# KDE/Qt apps dark mode (Dolphin, etc)
exec-once = cp -n ~/.config/kde/kdeglobals ~/.config/kdeglobals 2>/dev/null || true

# Dock
exec-once = nwg-dock-hyprland -d -i 48 -w 10 -mb 6 -hd 0

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,32
env = HYPRCURSOR_SIZE,32
env = XCURSOR_THEME,Twilight

# Dark theme
env = GTK_THEME,Adwaita:dark
env = QT_QPA_PLATFORMTHEME,kde
env = QT_STYLE_OVERRIDE,Breeze

###################
### PERMISSIONS ###
###################


#####################
### LOOK AND FEEL ###
#####################


general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border=rgb(cdd6f4)
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

misc {
    disable_hyprland_logo = no
}

decoration {
    rounding = 8
    
    blur {
        enabled = true
        size = 3
        passes = 3
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes

    bezier = myBezier, 0.1, 0.9, 0.05, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 90%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 10, default
}

dwindle {
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    new_on_top = true
}

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
}

# New gestures system (replaces gestures:workspace_swipe)
gesture = 3, horizontal, workspace

# Per-device input config (replaces device:<name> blocks)
device {
    name = epic mouse V1
    sensitivity = -0.1
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    repeat_rate = 35
    repeat_delay = 200

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

cursor {
    inactive_timeout = 30
    no_hardware_cursors = true
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER 

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, exec, kitty --class clipse -e clipse
bind = $mainMod SHIFT, V, togglefloating,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, W, exec, ~/.config/hypr/change-wallpaper.sh
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/wallpaper-wofi.sh
bind = $mainMod, D, exec, nwg-displays
bind = $mainMod, C, exec, GTK_THEME=Adwaita gnome-calendar
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d


bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && volumectl -u up
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && volumectl -u down
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && volumectl -u toggle-mute
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ && lightctl up
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- && lightctl down

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Lock screen
bind = $mainMod, L, exec, hyprlock

# Screenshot keybinds
bind = , Print, exec, grim - | wl-copy && notify-send "Screenshot" "Copied to clipboard"
bind = $mainMod, Print, exec, grim ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png && notify-send "Screenshot" "Saved to ~/Pictures"
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Region copied to clipboard"

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# Clipse clipboard manager
windowrulev2 = float, class:^(clipse)$
windowrulev2 = size 60% 60%, class:^(clipse)$
windowrulev2 = center, class:^(clipse)$