################
### MONITORS ###
################

# Laptop display (Full HD)
#monitor=eDP-1,1920x1080@60,0x0,1.0

# Disable laptop display when lid is closed, re-enable when opened (requires logind.conf to have HandleLidSwitch=ignore)
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, 1920x1080@60, 0x0, 1"

# 4K monitor at 150% scale
# monitor=DP-2,preferred,auto,1.5

# Monitor Arzopa 1080p (USB-C) - detectado em DP-2
monitor=DP-2,1920x1080@100,0x0,1.0

# Ultrawide (opcional)
#monitor=DP-2,3440x1440@59.97,1920x0,1.25

# Fallback para outros monitores externos
monitor=,preferred,auto,1.0


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = nautilus
$menu = vicinae toggle

#################
### AUTOSTART ###
#################

# Import Wayland env vars into systemd (needed for wallpaper service and other user services)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_RUNTIME_DIR DISPLAY

# Start awww-daemon first (needed for wallpaper)
exec-once = awww-daemon

# Apply wallpaper (awww wait blocks until daemon is ready)
exec-once = sleep 1 && awww img "$HOME/.config/walls/lock.jpg" --transition-type fade --transition-duration 1

exec-once = hypridle &

# wallpaper-slideshow is managed by systemd (wallpaper-slideshow.service)
exec-once = avizo-service &
exec-once = sleep 3 && pw-play /etc/profiles/per-user/@USERNAME@/share/sounds/Oxygen-Sys-Log-In.ogg


# Arzopa USB-C: já configurado direto no boot

# hyprmon auto-apply profile based on connected monitors
#exec-once = sleep 4 && ~/.config/hypr/scripts/hyprmon-auto.sh
#exec-once = sleep 5 && ~/.config/hypr/scripts/hyprmon-watch.sh

# GNOME/GTK apps dark mode (Calendar, etc)
exec-once = sleep 1 && gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark' && gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'

# KDE/Qt apps dark mode
exec-once = cp -n ~/.config/kde/kdeglobals ~/.config/kdeglobals 2>/dev/null || true

# Restore mouse sensitivity (from writable location)
exec-once = sleep 1 && [ -f ~/.local/state/hypr/mouse-sensitivity ] && hyprctl keyword input:sensitivity "$(cat ~/.local/state/hypr/mouse-sensitivity)"

# Vicinae launcher server
exec-once = vicinae server &

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,48


# AMD Wayland performance
env = WLR_NO_HARDWARE_CURSORS,1
env = AMD_VULKAN_ICD,RADV
env = WLR_RENDERER_ALLOW_SOFTWARE,0
env = LIBVA_DRIVER_NAME,radeonsi

# Dark theme
env = GTK_THEME,Adwaita:dark
env = QT_QPA_PLATFORMTHEME,kde
env = QT_STYLE_OVERRIDE,Breeze

###################
### PERMISSIONS ###
###################


#####################
### LOOK AND FEEL ###
#####################


general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border=rgb(cdd6f4)
    col.inactive_border = rgba(595959aa)

    resize_on_border = true
    extend_border_grab_area = 15

    layout = dwindle
}

misc {
    disable_hyprland_logo = yes
    vfr = true                    # Variable frame rate - only render when needed (huge perf gain)
    vrr = 0                       # Disabled - was causing issues with Arzorpa monitor
    focus_on_activate = true      # Auto-switch to workspace when app requests focus
}

debug {
    disable_logs = false          # Enable full logging for debugging monitor issue
}

render {
    direct_scanout = false        # Disabled - was causing issues with Arzopa USB-C monitor
}

decoration {
    rounding = 8

    blur {
        enabled = true
        size = 3
        passes = 1                # Reduced from 3 - huge perf improvement on 4K
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 8                 # Reduced from 12
        render_power = 2          # Reduced from 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes

    bezier = myBezier, 0.1, 0.9, 0.05, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 90%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 5, myBezier, slidefade 30%
}

dwindle {
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    new_on_top = true
}

# Per-device input config
# Use hyprctl devices to find device names
# device[epic-mouse-v1]:sensitivity = -0.1


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    repeat_rate = 35
    repeat_delay = 200

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true      
        disable_while_typing = true
        tap-to-click = true        
        scroll_factor = 1.0        
    }
}

cursor {
    inactive_timeout = 30
    no_hardware_cursors = true
}

xwayland {
    force_zero_scaling = true
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER 

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, pw-play /etc/profiles/per-user/@USERNAME@/share/sounds/Oxygen-Sys-Log-Out.ogg && loginctl terminate-session "$XDG_SESSION_ID"
bind = $mainMod, E, exec, $fileManager
bind = ALT, SPACE, exec, $menu
bind = $mainMod, V, exec, vicinae deeplink "vicinae://extensions/vicinae/clipboard/history"
bind = $mainMod, W, exec, ~/.config/hypr/change-wallpaper.sh
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/wallpaper-vicinae.sh
bind = $mainMod, D, exec, kitty --class hyprmon -e hyprmon
bind = $mainMod, B, exec, kitty --class battery-mgr -e ~/.config/hypr/battery-manager.sh
bind = $mainMod SHIFT, M, exec, kitty --class mouse-sens -e ~/.config/hypr/mouse-sensitivity.sh
bind = $mainMod, C, exec, kitty --class cava -e cava
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, G, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Move window between monitors
bind = $mainMod ALT, period, movewindow, mon:+1
bind = $mainMod ALT, comma, movewindow, mon:-1

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume controls (volumectl for avizo OSD + WirePlumber)
bindel = ,XF86AudioRaiseVolume, exec, volumectl -u up
bindel = ,XF86AudioLowerVolume, exec, volumectl -u down
bindel = ,XF86AudioMute, exec, volumectl toggle-mute
bindel = ,XF86AudioMicMute, exec, volumectl -m toggle-mute

# Wiremix audio mixer (floating terminal)
bind = $mainMod, A, exec, kitty --class wiremix -e wiremix
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ && lightctl up
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- && lightctl down

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Lock screen
bind = $mainMod, L, exec, hyprlock

# Screenshot keybinds
bind = , Print, exec, grim - | wl-copy && notify-send "Screenshot" "Copied to clipboard"
bind = $mainMod, Print, exec, grim ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png && notify-send "Screenshot" "Saved to ~/Pictures"
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Region copied to clipboard"

# GPU Screen Recorder
# Super+Shift+R = Toggle recording
bind = $mainMod SHIFT, R, exec, pgrep -x gpu-screen-rec && (pkill -SIGINT gpu-screen-rec && notify-send "Recording" "Stopped") || (gpu-screen-recorder -w DP-2 -f 60 -a default_output -o ~/Videos/recording_$(date +%Y%m%d_%H%M%S).mp4 & notify-send "Recording" "Started")
# Super+Shift+B = Toggle replay buffer (last 60 seconds)
bind = $mainMod SHIFT, B, exec, pgrep -x gpu-screen-rec && (pkill -SIGINT gpu-screen-rec && notify-send "Replay Buffer" "Stopped") || (gpu-screen-recorder -w DP-2 -f 60 -a default_output -r 60 -o ~/Videos & notify-send "Replay Buffer" "Started (60s)")
# Super+Shift+G = Save replay clip
bind = $mainMod SHIFT, G, exec, pkill -SIGUSR1 gpu-screen-rec && notify-send "Replay" "Clip saved!" || notify-send "Replay" "No replay buffer running"

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore ghost windows (xwayland)
windowrule {
    name = ghost-windows
    match:class = ^$
    match:title = ^$
    match:xwayland = 1
    suppress_event = focus
}


# Floating windows (kitty --class floating)
windowrule {
    name = floating
    match:class = ^(floating)$
    float = on
    size = 800 800
    center = on
}

# Wiremix audio mixer
windowrule {
    name = wiremix
    match:class = ^(wiremix)$
    float = on
    size = 800 800
    center = on
}

# Mouse sensitivity selector
windowrule {
    name = mouse-sens
    match:class = ^(mouse-sens)$
    float = on
    size = 800 800
    center = on
}

# Battery manager
windowrule {
    name = battery-mgr
    match:class = ^(battery-mgr)$
    float = on
    size = 800 800
    center = on
}

# Hyprmon monitor manager
windowrule {
    name = hyprmon
    match:class = ^(hyprmon)$
    float = on
    size = 800 800
    center = on
}

# Vicinae launcher
layerrule {
    name = vicinae-blur
    match:namespace = vicinae
    blur = true
    xray = 0
}

