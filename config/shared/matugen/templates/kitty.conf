# Matugen generated kitty colors
# Include this file in your kitty.conf with: include ~/.cache/matugen/kitty-colors.conf

foreground @{on_surface}
background @{surface}

selection_foreground @{on_primary}
selection_background @{primary}

cursor @{primary}
cursor_text_color @{on_primary}

# Normal colors
color0 @{surface}
color1 @{error}
color2 @{primary}
color3 @{tertiary}
color4 @{primary}
color5 @{secondary}
color6 @{tertiary}
color7 @{on_surface}

# Bright colors
color8 @{surface_container}
color9 @{error}
color10 @{primary}
color11 @{tertiary}
color12 @{primary}
color13 @{secondary}
color14 @{tertiary}
color15 @{on_surface}

# Tab bar
active_tab_foreground @{on_primary}
active_tab_background @{primary}
inactive_tab_foreground @{on_surface_variant}
inactive_tab_background @{surface_container}
